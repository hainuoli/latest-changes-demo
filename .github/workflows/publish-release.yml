name: Publish Release

on:
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # In production, add needs: [verify] for your project's tag build/test jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: hainuoli/release-actions@deab1fd103d3e6f46e32a062c40247314dceeb29
        with:
          command: publish-release
          token: ${{ github.token }}
          # draft: 'true'
          notes-file: docs/release-notes.md
